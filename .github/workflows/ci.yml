name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive affected base/head
        uses: nrwl/nx-set-shas@v4

      - name: Lint
        run: npx nx affected --target=lint --parallel=3

      - name: Unit tests
        run: npx nx affected --target=test --parallel=3 --ci

      - name: Build
        run: npx nx affected --target=build --parallel=2
