steps:
  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['install']

  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['run', 'build:admin']
    env:
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'

  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'create-env', 'apps/payment-admin/.next/standalone/.env']
    env:
      - 'API_BASE_URL=${_API_BASE_URL}'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: COPY-STUFF
    entrypoint: bash
    args:
      - '-e'
      - '-c'
      - |
        STANDALONE=apps/payment-admin/.next/standalone
        cp apps/payment-admin/app-production.yaml $$STANDALONE/app-production.yaml
        mkdir -p $$STANDALONE/static_directories_copy/_next_static
        cp -r apps/payment-admin/.next/static/* $$STANDALONE/static_directories_copy/_next_static/
        mkdir -p $$STANDALONE/apps/payment-admin/public
        cp -r apps/payment-admin/public/* $$STANDALONE/apps/payment-admin/public/

        # App Engine runs `npm start` from /workspace. We give it a package.json
        # with explicit runtime deps so `npm install` pulls in next/react —
        # Nx's Next.js standalone output doesn't bundle node_modules reliably
        # in monorepo setups, so we can't rely on what the standalone copied.
        cat > $$STANDALONE/package.json <<JSON
        {
          "name": "acepay-admin",
          "version": "1.0.0",
          "private": true,
          "scripts": { "start": "node apps/payment-admin/server.js" },
          "engines": { "node": "22" },
          "dependencies": {
            "next": "~16.1.6",
            "react": "^19.0.0",
            "react-dom": "^19.0.0"
          }
        }
        JSON

        # Stops gcloud from inheriting the repo .gitignore (which excludes .next/),
        # otherwise our deploy bundle gets filtered to nothing.
        touch $$STANDALONE/.gcloudignore

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app-production.yaml', '--no-cache', '--no-promote', '--version=dev-$SHORT_SHA']
    dir: 'apps/payment-admin/.next/standalone'

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" --service="admin" | tail -n +40 | xargs -r gcloud app versions delete --quiet

  - name: gcr.io/cloud-builders/curl
    entrypoint: bash
    secretEnv: ['SLACK_WEBHOOK_URL']
    args:
      - -c
      - |
        cat > /tmp/slack.json <<JSON
        {
          "text": ":construction: payment-admin deployed to development",
          "blocks": [
            {"type": "header", "text": {"type": "plain_text", "text": ":construction: payment-admin deployed", "emoji": true}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Environment*\ndevelopment"},
              {"type": "mrkdwn", "text": "*Project*\n\`${PROJECT_ID}\`"},
              {"type": "mrkdwn", "text": "*Version*\n\`dev-${SHORT_SHA}\`"},
              {"type": "mrkdwn", "text": "*Branch*\n\`${BRANCH_NAME}\`"}
            ]},
            {"type": "actions", "elements": [
              {"type": "button", "text": {"type": "plain_text", "text": "View build", "emoji": true},
               "url": "https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"}
            ]}
          ]
        }
        JSON
        curl -sS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/slack.json "$$SLACK_WEBHOOK_URL" || true

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _NODE_VERSION: '22'
  _NEXT_PUBLIC_API_URL: 'https://gateway-dot-${PROJECT_ID}.as.r.appspot.com'
  _API_BASE_URL: 'https://gateway-dot-${PROJECT_ID}.as.r.appspot.com'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SLACK_WEBHOOK_URL/versions/latest
      env: 'SLACK_WEBHOOK_URL'
