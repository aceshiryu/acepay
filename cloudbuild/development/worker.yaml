steps:
  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['install']

  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['run', 'build:worker']

  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'create-env', 'apps/payment-worker/dist/.env']
    env:
      - 'XENDIT_PLATFORM_ACCOUNT_ID=${_XENDIT_PLATFORM_ACCOUNT_ID}'
      - 'XENDIT_PAYOUT_FEE_RESERVE=${_XENDIT_PAYOUT_FEE_RESERVE}'
      - 'NODE_ENV=${_NODE_ENV}'
      - 'LEMONSQUEEZY_TEST_MODE=${_LEMONSQUEEZY_TEST_MODE}'
      - 'DB_SSL=true'
      - 'DB_LOGGING=false'
    secretEnv:
      [
        'WEBHOOK_SECRET_ENCRYPTION_KEY',
        'DB_HOST',
        'DB_PORT',
        'DB_USER',
        'DB_PASSWORD',
        'DB_NAME',
        'REDIS_URL',
        'LEMONSQUEEZY_API_KEY',
        'LEMONSQUEEZY_STORE_ID',
        'LEMONSQUEEZY_WEBHOOK_SECRET',
        'LEMONSQUEEZY_VARIANT_ID',
        'XENDIT_SECRET_KEY',
        'XENDIT_WEBHOOK_TOKEN',
      ]

  - name: 'gcr.io/cloud-builders/gcloud'
    id: COPY-APP-YAML
    entrypoint: bash
    args:
      - '-e'
      - '-c'
      - |
        cp apps/payment-worker/app.yaml apps/payment-worker/dist/app.yaml

  - name: bash:5
    id: VERIFY-ENV
    args:
      - '-c'
      - |
        echo "=== Non-secret env values (verify these) ==="
        grep -E '^(NODE_ENV|XENDIT_PLATFORM_ACCOUNT_ID|XENDIT_PAYOUT_FEE_RESERVE|DB_SSL|DB_LOGGING|LEMONSQUEEZY_TEST_MODE)=' apps/payment-worker/dist/.env || echo '(none found!)'
        echo ""
        echo "=== Secret env presence (key=set/unset) ==="
        for k in DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME REDIS_URL WEBHOOK_SECRET_ENCRYPTION_KEY LEMONSQUEEZY_API_KEY LEMONSQUEEZY_STORE_ID LEMONSQUEEZY_WEBHOOK_SECRET LEMONSQUEEZY_VARIANT_ID XENDIT_SECRET_KEY XENDIT_WEBHOOK_TOKEN; do
          if grep -q "^$k=" apps/payment-worker/dist/.env; then echo "$k=set"; else echo "$k=UNSET"; fi
        done

  - name: 'gcr.io/cloud-builders/gcloud'
    id: COPY-ROBOTS-TXT
    entrypoint: bash
    args:
      - '-e'
      - '-c'
      - |
        cp apps/payment-worker/robots.txt apps/payment-worker/dist/robots.txt

  # Rewrite dist/package.json as a slim App-Engine-friendly version.
  - name: node:$_NODE_VERSION
    id: SLIM-PACKAGE-JSON
    entrypoint: node
    args:
      - '-e'
      - |
        const fs = require('fs');
        const src = JSON.parse(fs.readFileSync('apps/payment-worker/dist/package.json'));
        const out = {
          name: 'acepay-payment-worker',
          version: src.version || '1.0.0',
          private: true,
          scripts: { start: 'node main.js' },
          engines: { node: '22' },
          main: 'main.js',
          dependencies: src.dependencies || {},
        };
        fs.writeFileSync('apps/payment-worker/dist/package.json', JSON.stringify(out, null, 2));
        console.log('Wrote slim package.json with', Object.keys(out.dependencies).length, 'deps');

  # .gcloudignore excludes node_modules (App Engine 10k-file limit). App Engine
  # runs `npm install --production` server-side from package.json after deploy.
  - name: bash:5
    id: WRITE-GCLOUDIGNORE
    args: ['-c', 'echo node_modules/ > apps/payment-worker/dist/.gcloudignore']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'app',
        'deploy',
        'app.yaml',
        '--no-cache',
        '--version=dev-$SHORT_SHA',
      ]
    dir: 'apps/payment-worker/dist'

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" --service="worker" | tail -n +40 | xargs -r gcloud app versions delete --quiet

  - name: gcr.io/cloud-builders/curl
    entrypoint: bash
    secretEnv: ['SLACK_WEBHOOK_URL']
    args:
      - -c
      - |
        cat > /tmp/slack.json <<JSON
        {
          "text": ":construction: payment-worker deployed to development",
          "blocks": [
            {"type": "header", "text": {"type": "plain_text", "text": ":construction: payment-worker deployed", "emoji": true}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Environment*\ndevelopment"},
              {"type": "mrkdwn", "text": "*Project*\n\`${PROJECT_ID}\`"},
              {"type": "mrkdwn", "text": "*Version*\n\`dev-${SHORT_SHA}\`"},
              {"type": "mrkdwn", "text": "*Branch*\n\`${BRANCH_NAME}\`"}
            ]},
            {"type": "actions", "elements": [
              {"type": "button", "text": {"type": "plain_text", "text": "View build", "emoji": true},
               "url": "https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"}
            ]}
          ]
        }
        JSON
        curl -sS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/slack.json "$$SLACK_WEBHOOK_URL" || true

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  # Marketplace (xenPlatform): the MASTER account's Business ID (Xendit dashboard →
  # Settings → Business profile). Not a secret. Marketplace payments and fee splits
  # fail without it. Set it on the trigger: _XENDIT_PLATFORM_ACCOUNT_ID=<24-hex id>.
  _XENDIT_PLATFORM_ACCOUNT_ID: ''
  _XENDIT_PAYOUT_FEE_RESERVE: '2500'
  _NODE_VERSION: '22'
  _NODE_ENV: development
  _LEMONSQUEEZY_TEST_MODE: 'true'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SLACK_WEBHOOK_URL/versions/latest
      env: 'SLACK_WEBHOOK_URL'
    - versionName: projects/$PROJECT_ID/secrets/WEBHOOK_SECRET_ENCRYPTION_KEY/versions/latest
      env: 'WEBHOOK_SECRET_ENCRYPTION_KEY'
    - versionName: projects/$PROJECT_ID/secrets/DB_HOST/versions/latest
      env: 'DB_HOST'
    - versionName: projects/$PROJECT_ID/secrets/DB_PORT/versions/latest
      env: 'DB_PORT'
    - versionName: projects/$PROJECT_ID/secrets/DB_USER/versions/latest
      env: 'DB_USER'
    - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
      env: 'DB_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/DB_NAME/versions/latest
      env: 'DB_NAME'
    - versionName: projects/$PROJECT_ID/secrets/REDIS_URL/versions/latest
      env: 'REDIS_URL'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_API_KEY/versions/latest
      env: 'LEMONSQUEEZY_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_STORE_ID/versions/latest
      env: 'LEMONSQUEEZY_STORE_ID'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_WEBHOOK_SECRET/versions/latest
      env: 'LEMONSQUEEZY_WEBHOOK_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_VARIANT_ID/versions/latest
      env: 'LEMONSQUEEZY_VARIANT_ID'
    - versionName: projects/$PROJECT_ID/secrets/XENDIT_SECRET_KEY/versions/latest
      env: 'XENDIT_SECRET_KEY'
    - versionName: projects/$PROJECT_ID/secrets/XENDIT_WEBHOOK_TOKEN/versions/latest
      env: 'XENDIT_WEBHOOK_TOKEN'
