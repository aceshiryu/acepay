steps:
  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['install']

  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['run', 'build:gateway']

  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'create-env', 'apps/payment-gateway/dist/.env']
    env:
      - 'NODE_ENV=${_NODE_ENV}'
      - 'CORS_ORIGINS=${_ADMIN_URL}'
      - 'PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}'
      - 'ADMIN_JWT_TTL_HOURS=${_ADMIN_JWT_TTL_HOURS}'
      - 'LEMONSQUEEZY_TEST_MODE=${_LEMONSQUEEZY_TEST_MODE}'
      - 'DB_SSL=true'
      - 'DB_LOGGING=false'
    secretEnv:
      [
        'ADMIN_JWT_SECRET',
        'WEBHOOK_SECRET_ENCRYPTION_KEY',
        'DB_HOST',
        'DB_PORT',
        'DB_USER',
        'DB_PASSWORD',
        'DB_NAME',
        'REDIS_URL',
        'LEMONSQUEEZY_API_KEY',
        'LEMONSQUEEZY_STORE_ID',
        'LEMONSQUEEZY_WEBHOOK_SECRET',
        'LEMONSQUEEZY_VARIANT_ID',
        'XENDIT_SECRET_KEY',
        'XENDIT_WEBHOOK_TOKEN',
        'SEED_ADMIN_EMAIL',
        'SEED_ADMIN_PASSWORD',
      ]

  - name: 'gcr.io/cloud-builders/gcloud'
    id: COPY-APP-YAML
    entrypoint: bash
    args:
      - '-e'
      - '-c'
      - |
        cp apps/payment-gateway/app.yaml apps/payment-gateway/dist/app.yaml
        # Stops gcloud from inheriting the repo .gitignore (which excludes dist/).
        touch apps/payment-gateway/dist/.gcloudignore

  - id: npm-install
    name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['install']
    dir: 'apps/payment-gateway/dist'

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.yaml', '--no-cache', '--no-promote', '--version=dev-$SHORT_SHA']
    dir: 'apps/payment-gateway/dist'

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" --service="gateway" | tail -n +40 | xargs -r gcloud app versions delete --quiet

  - name: gcr.io/cloud-builders/curl
    entrypoint: bash
    secretEnv: ['SLACK_WEBHOOK_URL']
    args:
      - -c
      - |
        cat > /tmp/slack.json <<JSON
        {
          "text": ":construction: payment-gateway deployed to development",
          "blocks": [
            {"type": "header", "text": {"type": "plain_text", "text": ":construction: payment-gateway deployed", "emoji": true}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Environment*\ndevelopment"},
              {"type": "mrkdwn", "text": "*Project*\n\`${PROJECT_ID}\`"},
              {"type": "mrkdwn", "text": "*Version*\n\`dev-${SHORT_SHA}\`"},
              {"type": "mrkdwn", "text": "*Branch*\n\`${BRANCH_NAME}\`"}
            ]},
            {"type": "actions", "elements": [
              {"type": "button", "text": {"type": "plain_text", "text": "View build", "emoji": true},
               "url": "https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}"}
            ]}
          ]
        }
        JSON
        curl -sS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/slack.json "$$SLACK_WEBHOOK_URL" || true

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _NODE_VERSION: '22'
  _NODE_ENV: production
  _ADMIN_URL: https://admin-dot-${PROJECT_ID}.as.r.appspot.com
  _PUBLIC_BASE_URL: https://${PROJECT_ID}.as.r.appspot.com
  _ADMIN_JWT_TTL_HOURS: '12'
  _LEMONSQUEEZY_TEST_MODE: 'true'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SLACK_WEBHOOK_URL/versions/latest
      env: 'SLACK_WEBHOOK_URL'
    - versionName: projects/$PROJECT_ID/secrets/ADMIN_JWT_SECRET/versions/latest
      env: 'ADMIN_JWT_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/WEBHOOK_SECRET_ENCRYPTION_KEY/versions/latest
      env: 'WEBHOOK_SECRET_ENCRYPTION_KEY'
    - versionName: projects/$PROJECT_ID/secrets/DB_HOST/versions/latest
      env: 'DB_HOST'
    - versionName: projects/$PROJECT_ID/secrets/DB_PORT/versions/latest
      env: 'DB_PORT'
    - versionName: projects/$PROJECT_ID/secrets/DB_USER/versions/latest
      env: 'DB_USER'
    - versionName: projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
      env: 'DB_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/DB_NAME/versions/latest
      env: 'DB_NAME'
    - versionName: projects/$PROJECT_ID/secrets/REDIS_URL/versions/latest
      env: 'REDIS_URL'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_API_KEY/versions/latest
      env: 'LEMONSQUEEZY_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_STORE_ID/versions/latest
      env: 'LEMONSQUEEZY_STORE_ID'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_WEBHOOK_SECRET/versions/latest
      env: 'LEMONSQUEEZY_WEBHOOK_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/LEMONSQUEEZY_VARIANT_ID/versions/latest
      env: 'LEMONSQUEEZY_VARIANT_ID'
    - versionName: projects/$PROJECT_ID/secrets/XENDIT_SECRET_KEY/versions/latest
      env: 'XENDIT_SECRET_KEY'
    - versionName: projects/$PROJECT_ID/secrets/XENDIT_WEBHOOK_TOKEN/versions/latest
      env: 'XENDIT_WEBHOOK_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/SEED_ADMIN_EMAIL/versions/latest
      env: 'SEED_ADMIN_EMAIL'
    - versionName: projects/$PROJECT_ID/secrets/SEED_ADMIN_PASSWORD/versions/latest
      env: 'SEED_ADMIN_PASSWORD'
