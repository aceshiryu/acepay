steps:
  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['install']

  - name: node:$_NODE_VERSION
    entrypoint: npm
    args: ['run', 'build:admin']
    env:
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'

  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'create-env', 'apps/payment-admin/.next/standalone/.env']
    env:
      - 'API_BASE_URL=${_API_BASE_URL}'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'

  - name: 'gcr.io/cloud-builders/gcloud'
    id: COPY-STUFF
    entrypoint: bash
    args:
      - '-e'
      - '-c'
      - |
        # Stage Next.js standalone output as the deploy bundle root.
        mkdir -p apps/payment-admin/dist
        cp -r apps/payment-admin/.next/standalone/. apps/payment-admin/dist/

        # Static assets served by App Engine's static_dir handler.
        mkdir -p apps/payment-admin/dist/static_directories_copy/_next_static
        cp -r apps/payment-admin/.next/static/. apps/payment-admin/dist/static_directories_copy/_next_static/

        # Public assets — standalone output omits these.
        mkdir -p apps/payment-admin/dist/apps/payment-admin/public
        cp -r apps/payment-admin/public/. apps/payment-admin/dist/apps/payment-admin/public/

        # App Engine config + robots.
        cp apps/payment-admin/app-production.yaml apps/payment-admin/dist/app-production.yaml
        cp apps/payment-admin/robots.txt apps/payment-admin/dist/robots.txt

        # package.json so `npm start` resolves to the standalone server and
        # App Engine's `npm install` pulls in next/react if standalone's
        # node_modules wasn't fully populated.
        cat > apps/payment-admin/dist/package.json <<JSON
        {
          "name": "acepay-admin",
          "version": "1.0.0",
          "private": true,
          "scripts": { "start": "node apps/payment-admin/server.js" },
          "engines": { "node": "22" },
          "dependencies": {
            "next": "~16.1.6",
            "react": "^19.0.0",
            "react-dom": "^19.0.0"
          }
        }
        JSON

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app-production.yaml', '--no-cache']
    dir: 'apps/payment-admin/dist'

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud app versions list --format="value(version.id)" --sort-by="~version.createTime" --service="admin" | tail -n +40 | xargs -r gcloud app versions delete --quiet

  - name: gcr.io/cloud-builders/curl
    entrypoint: bash
    secretEnv: ['SLACK_WEBHOOK_URL']
    args:
      - -c
      - |
        cat > /tmp/slack.json <<JSON
        {
          "text": ":rocket: payment-admin deployed to production",
          "blocks": [
            {"type": "header", "text": {"type": "plain_text", "text": ":rocket: payment-admin deployed", "emoji": true}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Environment*\nproduction"},
              {"type": "mrkdwn", "text": "*Project*\n\`${PROJECT_ID}\`"},
              {"type": "mrkdwn", "text": "*Commit*\n\`${SHORT_SHA}\`"},
              {"type": "mrkdwn", "text": "*Branch*\n\`${BRANCH_NAME}\`"}
            ]},
            {"type": "actions", "elements": [
              {"type": "button", "text": {"type": "plain_text", "text": "View build", "emoji": true},
               "url": "https://console.cloud.google.com/cloud-build/builds/${BUILD_ID}?project=${PROJECT_ID}",
               "style": "primary"}
            ]}
          ]
        }
        JSON
        curl -sS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/slack.json "$$SLACK_WEBHOOK_URL" || true

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _NODE_VERSION: '22'
  _NEXT_PUBLIC_API_URL: 'https://gateway-dot-${PROJECT_ID}.as.r.appspot.com'
  _API_BASE_URL: 'https://gateway-dot-${PROJECT_ID}.as.r.appspot.com'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SLACK_WEBHOOK_URL/versions/latest
      env: 'SLACK_WEBHOOK_URL'
