runtime: nodejs22
service: admin
entrypoint: npm start

instance_class: F1

automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: 1
  min_instances: 0

inbound_services:
  - warmup

env_variables:
  NODE_ENV: 'production'

handlers:
  # The next 2 static directories will be generated by our custom cloud build step and
  # npm run copy:static-files command that will create these directories in the deployment
  - url: /_next/static
    static_dir: static_directories_copy/_next_static

  - url: /_ah/warmup
    script: auto

  - url: /robots.txt
    static_files: robots.txt
    upload: robots.txt

  - url: /.*
    secure: always
    script: auto
